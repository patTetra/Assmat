<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AssMat Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-card: #334155;
      --border: rgba(255, 255, 255, 0.1);
      
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --success: #10b981;
      --danger: #f43f5e;
      --warning: #f59e0b;
      
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { max-width: 100vw; overflow-x: hidden; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    
    .brand-icon-btn {
      width: 42px; height: 42px;
      background: var(--accent-gradient); border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      box-shadow: 0 4px 12px var(--accent-glow); flex-shrink: 0;
      border: none; cursor: pointer; color: white;
      transition: transform 0.2s ease;
    }
    .brand-icon-btn:active { transform: scale(0.92); }

    header h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.35rem; font-weight: 800; color: #fff; line-height: 1.1; }
    header p { font-size: 0.8rem; color: var(--text-muted); }

    .sync-status-container { display: flex; align-items: center; justify-content: center; padding: 6px; cursor: pointer; }
    .sync-led { width: 10px; height: 10px; border-radius: 50%; background-color: var(--text-muted); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); transition: all 0.3s ease; }
    .sync-led.online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
    .sync-led.offline { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .sync-led.syncing { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse-led 1s infinite alternate; }

    @keyframes pulse-led { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

    .slider-container { position: relative; margin-bottom: 1.25rem; }
    .slider-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; gap: 1rem; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
    .slider-track::-webkit-scrollbar { display: none; }

    .child-slide { flex: 0 0 100%; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .slide-header { display: flex; justify-content: space-between; align-items: center; }
    .slide-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.2rem; font-weight: 800; color: #fff; }

    .slider-dots { display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-card); transition: all 0.2s ease; }
    .dot.active { background: var(--accent-light); width: 20px; border-radius: 10px; }

    .nav-tabs { display: flex; gap: 0.35rem; margin-bottom: 1.25rem; background: var(--surface); padding: 5px; border-radius: var(--radius-lg); border: 1px solid var(--border); overflow-x: auto; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    
    .tab-btn { flex: 1; min-width: 75px; background: transparent; border: none; padding: 0.65rem 0.5rem; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 0.82rem; color: var(--text-muted); transition: all 0.2s ease; text-align: center; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 12px var(--accent-glow); }

    .sub-tab-btn { flex: 1; min-width: 75px; background: transparent; border: none; padding: 0.65rem 0.5rem; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 0.82rem; color: var(--text-muted); transition: all 0.2s ease; text-align: center; white-space: nowrap; }
    .sub-tab-btn.active { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 12px var(--accent-glow); }

    .tab-content, .sub-tab-content { display: none; }
    .tab-content.active, .sub-tab-content.active { display: block; animation: fadeIn 0.25s ease-out; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 1.15rem; margin-bottom: 1.25rem; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .card h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; color: #fff; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.85rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.85rem; }
    
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    
    input, select { width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.9rem; font-weight: 500; color: #fff; background: var(--surface-card); outline: none; }

    .checkbox-group { display: flex; align-items: center; gap: 0.6rem; background: var(--surface-card); padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border); cursor: pointer; }
    .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

    .btn { border: none; padding: 0.75rem 1.2rem; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; font-size: 0.88rem; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; }
    .btn-primary { background: var(--accent-gradient); color: white; box-shadow: 0 4px 14px var(--accent-glow); }
    .btn-secondary { background: var(--surface-card); color: #fff; border: 1px solid var(--border); }
    .btn-danger { background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
    .btn-sm { padding: 0.45rem 0.8rem; font-size: 0.8rem; }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .calendar-days-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.5rem; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    
    .cal-day { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-sm); min-height: 70px; padding: 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.15s ease; width: 100%; }
    .cal-day:active { transform: scale(0.95); }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.is-weekend { background: rgba(15, 23, 42, 0.45); border-color: rgba(255, 255, 255, 0.04); opacity: 0.75; }
    .cal-day.has-presence { background: rgba(99, 102, 241, 0.18); border: 1px solid rgba(129, 140, 248, 0.4); opacity: 1; }
    .cal-day-num { font-size: 0.75rem; font-weight: 700; color: #fff; width: 100%; text-align: left; }
    
    .cal-day-badge-stack { display: flex; flex-direction: column; align-items: center; gap: 1px; width: 100%; margin-top: 2px; }
    .cal-day-badge-stack .time-line { font-size: 0.62rem; font-weight: 700; line-height: 1.1; color: var(--accent-light); }
    .cal-day-badge { font-size: 0.58rem; font-weight: 600; padding: 2px 3px; border-radius: 4px; text-align: center; width: 100%; }
    .cal-day-badge.off { color: var(--text-muted); font-size: 0.75rem; opacity: 0.4; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 480px; padding: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }

    details summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--accent-light); padding: 0.5rem 0; }
    .week-grid { display: grid; gap: 0.5rem; margin-top: 0.75rem; }
    .week-day-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface-card); padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .week-day-row.weekend-row { background: rgba(15, 23, 42, 0.4); opacity: 0.7; }
    .week-day-row label { font-size: 0.8rem; text-transform: none; color: #fff; width: 80px; }
    .week-day-row input[type="time"] { width: auto; padding: 0.3rem 0.5rem; font-size: 0.8rem; }

    .table-container { width: 100%; overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); margin-top: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; background: var(--surface-card); white-space: nowrap; }
    th { background: rgba(0, 0, 0, 0.2); color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 0.68rem; padding: 0.75rem 0.6rem; border-bottom: 1px solid var(--border); text-align: center; }
    td { padding: 0.75rem 0.6rem; border-bottom: 1px solid var(--border); text-align: center; color: var(--text-main); font-weight: 500; }

    .badge { padding: 0.25rem 0.5rem; border-radius: 12px; font-size: 0.72rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.25rem; }
    .badge-primary { background: rgba(99, 102, 241, 0.2); color: var(--accent-light); border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-danger { background: rgba(244, 63, 94, 0.2); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }

    .summary-card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; margin-top: 1rem; }
    .summary-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; font-size: 0.85rem; color: var(--text-muted); }
    .summary-line.total { border-top: 1px solid var(--border); padding-top: 0.85rem; margin-top: 0.85rem; margin-bottom: 0; font-size: 1.05rem; font-weight: 800; color: #fff; }

    .legal-alert-box { margin-top: 0.85rem; padding: 0.85rem; background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.4); border-radius: var(--radius-md); font-size: 0.8rem; color: #fecdd3; line-height: 1.4; }
    .legal-alert-box h4 { color: #f43f5e; font-size: 0.85rem; font-weight: 800; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
    .legal-alert-box ul { margin-left: 1.2rem; margin-top: 0.4rem; margin-bottom: 0.5rem; }
    .legal-alert-box li { margin-bottom: 0.2rem; }

    .pajemploi-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(16, 185, 129, 0.4); border-radius: var(--radius-lg); padding: 1.15rem; margin-top: 1.25rem; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1); }
    .pajemploi-title { display: flex; align-items: center; justify-content: space-between; color: #10b981; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 800; margin-bottom: 0.85rem; border-bottom: 1px solid rgba(16, 185, 129, 0.2); padding-bottom: 0.5rem; }
    .pajemploi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; }
    .pajemploi-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 0.65rem 0.85rem; border-radius: var(--radius-md); }
    .pajemploi-item-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .pajemploi-item-val { font-size: 1.05rem; font-weight: 800; color: #fff; margin-top: 2px; }

    .info-group { background: var(--surface-card); border-radius: var(--radius-md); padding: 0.85rem; border: 1px solid var(--border); margin-bottom: 0.85rem; }
    .info-group h3 { font-size: 0.85rem; color: var(--accent-light); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
